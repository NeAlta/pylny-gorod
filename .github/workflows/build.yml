# Облачная сборка установщиков на GitHub Actions (бесплатно для публичных и личных репозиториев).
# Результаты: вкладка Actions → последний запуск → Artifacts.

name: Сборка установщиков

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup_platforms.dart
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk pylny_gorod.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pylny_gorod-android
          path: pylny_gorod.apk
      # Прямая ссылка на APK: вкладка Releases репозитория (удобно открыть прямо с телефона)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Пыльный город, сборка ${{ github.run_number }}
          files: pylny_gorod.apk

  ios:
    name: iOS IPA (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup_platforms.dart
      - run: flutter build ios --release --no-codesign
      - name: Упаковать в .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr pylny_gorod-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pylny_gorod-ios
          path: pylny_gorod-unsigned.ipa
